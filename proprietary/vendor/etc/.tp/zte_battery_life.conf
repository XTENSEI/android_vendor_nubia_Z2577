#control parameters for ZTE BATTERY LIFE ALGO
zbl,enable = <1>

# the following two parameters from battery spec
# for example:the remaining battery life is 80% after 1000 cycles
# zbl,spec-cycle-count means 1000 cycles
# zbl,spec-after-cycle-life means 80% capacity
zbl,spec-cycle-count = <800>
zbl,spec-after-cycle-life = <8000>

zbl,enable-night-charge = <1>

zbl,reduce-fcv-enable = <1>
zbl,cycle-steps = <3>
zbl,cycle-count = <100 300 800>
zbl,fcv-cut-table = <32 64 164>

#One line cannot exceed 2048 characters.
